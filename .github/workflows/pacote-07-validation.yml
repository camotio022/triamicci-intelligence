name: Pacote 07 - cobertura e dobras (sem deploy)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testes de pagamentos e jornada
        run: node --test tests/coverage-engine.test.js
      - name: Sintaxe do backend
        run: |
          node --check server/coverage/engine.js
          node --check api/coverage/manage.js
      - name: Dependências
        run: |
          if test -f package-lock.json; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Build Vite
        run: npm run build
