name: Importar catálogo Triamicci (manual)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run não grava; apply importa produtos inativos'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read
  id-token: write

jobs:
  import:
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'apply' && 'firebase-catalog-import' || 'catalog-dry-run' }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Simular e validar catálogo (sem acesso ao Firebase)
        run: node scripts/seed-product-catalog.mjs
      - name: Autenticar no Google Cloud somente na importação
        if: ${{ inputs.mode == 'apply' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_CATALOG_SERVICE_ACCOUNT }}
      - name: Importar catálogo inativo no Firestore
        if: ${{ inputs.mode == 'apply' }}
        env:
          GOOGLE_CLOUD_PROJECT: triamicci-intelligence
          CONFIRM_FIREBASE_PROJECT: triamicci-intelligence
        run: node scripts/seed-product-catalog.mjs --apply
