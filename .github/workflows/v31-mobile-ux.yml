name: V3.1 - Experiência mobile (sem deploy)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Compilar frontend mobile-first de produção
        run: npm run build
      - name: Instalar navegador
        run: npx playwright install chromium
      - name: Verificar fluxos e responsividade
        run: npm run test:browser
