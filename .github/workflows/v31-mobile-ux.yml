name: V3.1 - Experiência mobile (sem deploy)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund && npm install --no-save playwright@1.56.0
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Verificar fluxos e responsividade
        run: node --test tests/v31-mobile-ux.test.mjs
