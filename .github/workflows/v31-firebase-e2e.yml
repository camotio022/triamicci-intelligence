name: V3.1 - Firebase E2E (sem deploy)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v31-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Testar Firebase Auth + Firestore isolados
        env:
          CI: true
        run: npx --yes firebase-tools@14.2.0 emulators:exec --project demo-triamicci-v31 --only auth,firestore "node --test tests/v31-emulator.test.mjs"
