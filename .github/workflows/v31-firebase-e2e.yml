name: V3.1 - Firebase E2E (sem deploy)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v31-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Instalar navegador de homologação
        run: npx playwright install --with-deps chromium
      - name: Preservar todas as regras de negócio
        run: npm run test:rules
      - name: Testar Firebase Auth + Firestore isolados
        env:
          CI: true
        run: npm run test:emulator

  cloudinary-private-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test synthetic evidence with real private storage
        env:
          CHECKLIST_CLOUDINARY_CLOUD_NAME: ${{ vars.CHECKLIST_CLOUDINARY_CLOUD_NAME }}
          CHECKLIST_CLOUDINARY_PRESET: ${{ vars.CHECKLIST_CLOUDINARY_PRESET }}
          CHECKLIST_CLOUDINARY_API_KEY: ${{ secrets.CHECKLIST_CLOUDINARY_API_KEY }}
          CHECKLIST_CLOUDINARY_API_SECRET: ${{ secrets.CHECKLIST_CLOUDINARY_API_SECRET }}
        run: node scripts/test-cloudinary-private.mjs
