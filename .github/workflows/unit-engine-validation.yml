name: Fase 2 - motor de unidades (sem deploy)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências
        run: |
          if test -f package-lock.json; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Testes do motor de unidades
        run: node --test tests/unit-engine.test.js tests/measurement-profiles.test.js tests/package-conference.test.js tests/package-reconciliation.test.js tests/package-review-rules.test.js tests/package-lot-allocation.test.js tests/package-commit-guards.test.js tests/package-adjustment-plan.test.js tests/v3-catalog-policy.test.js
      - name: Regressões de operações e produção
        run: node --test tests/production-logic.test.mjs tests/physical-operations.test.mjs tests/daily-inventory.test.js tests/production-transformation.test.js tests/production-daily-task.test.js tests/recipe-graph.test.js tests/temporal-policy.test.js tests/investigation-rules.test.js tests/v4-coverage-summary.test.js
      - name: Sintaxe da API V3 e dos motores
        run: node --check server/operations/v3-service.js && node --check server/operations/v3-ledger.js && node --check server/operations/v3-catalog-policy.js
      - name: Contrato V3.1 de data e permissões
        run: node --test tests/v31-tempo-permissoes.test.mjs tests/v31-attendance.test.mjs tests/v31-redaction.test.mjs
      - name: Build
        run: npm run build
