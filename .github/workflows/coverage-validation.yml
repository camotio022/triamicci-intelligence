name: Validação da Cobertura Inteligente
on:
  pull_request:
    branches: [development, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/coverage-month.test.mjs tests/coverage-board-state.test.mjs tests/operational-coverage.test.mjs
      - run: npm run test:rules
      - run: npm run build
