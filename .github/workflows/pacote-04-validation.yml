name: Pacote 04 - validação sem deploy
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências de forma reprodutível
        run: |
          if test -f package-lock.json; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Testar regras de inventário
        run: node --test tests/daily-inventory.test.js tests/inventory-closure.test.js
      - name: Checar sintaxe do backend
        run: |
          node --check server/operations/daily-inventory.js
          node --check server/operations/daily-report.js
          node --check server/operations/inventory-closure.js
          node --check server/operations/inventory-closure-rules.js
          node --check api/operations/stock.js
          node --check api/dashboard/summary.js
      - name: Compilar interface
        run: npm run build
