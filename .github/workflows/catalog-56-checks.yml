name: Validar catálogo operacional 56
on:
  pull_request:
    paths:
      - 'src/**'
      - 'api/**'
      - 'data/triamicci-*'
      - 'tests/catalog-56.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/catalog-56-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validar integridade dos 56 produtos
        run: node --test tests/catalog-56.test.mjs
      - name: Build do aplicativo
        run: npm run build
